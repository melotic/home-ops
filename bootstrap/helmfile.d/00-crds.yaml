---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.
#
# Chart and version come from each app's OCIRepository, so bootstrap cannot drift from what Flux
# reconciles.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

bases:
  - default.yaml
defaultInherit: default

releases:
  - name: cert-manager
    namespace: cert-manager

  - name: cloudflare-dns
    namespace: network
    values: ['./templates/values.yaml.gotmpl']

  - name: external-secrets
    namespace: external-secrets

  - name: onepassword
    namespace: external-secrets

  - name: envoy-gateway
    namespace: network

  - name: grafana
    namespace: monitoring

  - name: kube-prometheus-stack
    namespace: monitoring

  - name: kopiur
    namespace: kopiur-system

  - name: snapshot-controller
    namespace: kube-system
