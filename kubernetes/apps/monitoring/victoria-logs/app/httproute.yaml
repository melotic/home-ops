---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "VictoriaLogs"
    gethomepage.dev/description: "Logs"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "victorialogs.png"
    gethomepage.dev/href: "https://victoria-logs.melotic.dev"
  name: victoria-logs
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - victoria-logs.melotic.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /select/vmui/
            statusCode: 302
      matches:
        - path:
            type: Exact
            value: /
    - backendRefs:
        - name: victoria-logs-server
          port: 9428
      matches:
        - path:
            type: PathPrefix
            value: /
