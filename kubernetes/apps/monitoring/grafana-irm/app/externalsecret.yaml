---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-irm-tfvars
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-irm-tfvars
    template:
      data:
        stack_url: "{{ .STACK_URL }}"
        token: "{{ .TOKEN | trim }}"
  dataFrom:
    - extract:
        key: grafana-cloud
