---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - matrix.melotic.dev
  rules:
    - backendRefs:
        - name: ess-synapse
          port: 8008
      matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse
    - backendRefs:
        - name: ess-well-known
          port: 8010
      matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
        - path:
            type: PathPrefix
            value: /
