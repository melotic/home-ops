---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mas
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - account.melotic.dev
  rules:
    - backendRefs:
        - name: ess-matrix-authentication-service
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
