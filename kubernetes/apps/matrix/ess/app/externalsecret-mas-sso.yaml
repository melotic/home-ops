---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ess-mas-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ess-mas-sso
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        sso.yaml: |
          upstream_oauth2:
            providers:
              - id: 01M4SAQHF1HGJXRDAJ7EY3ZFAD
                human_name: authentik
                issuer: "https://sso.melotic.dev/application/o/matrix/"
                client_id: "{{ .matrix_client_id }}"
                client_secret: "{{ .matrix_client_secret }}"
                token_endpoint_auth_method: client_secret_basic
                scope: "openid profile email"
                claims_imports:
                  localpart:
                    action: require
                  displayname:
                    action: suggest
                  email:
                    action: suggest
          passwords:
            enabled: false
  dataFrom:
    - extract:
        key: authentik-oidc
