---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-alertmanager-receiver
spec:
  chartRef:
    kind: OCIRepository
    name: matrix-alertmanager-receiver
  interval: 1h
  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/metio/matrix-alertmanager-receiver
              tag: 2026.9.23@sha256:854b615e109ccbbd0fb7e7a65028d876115d36d522ed65cb564154495e35bc03
            args:
              - --config-path=/etc/matrix-alertmanager-receiver/config.yaml
            envFrom:
              - secretRef:
                  name: matrix-alertmanager-receiver
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: matrix-alertmanager-receiver-config
        globalMounts:
          - path: /etc/matrix-alertmanager-receiver/config.yaml
            subPath: config.yaml
            readOnly: true
