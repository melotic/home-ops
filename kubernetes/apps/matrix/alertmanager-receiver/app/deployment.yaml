---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-alertmanager-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-alertmanager-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-alertmanager-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: docker.io/metio/matrix-alertmanager-receiver:2026.9.23@sha256:854b615e109ccbbd0fb7e7a65028d876115d36d522ed65cb564154495e35bc03
          args:
            - --config-path=/etc/matrix-alertmanager-receiver/config.yaml
          envFrom:
            - secretRef:
                name: matrix-alertmanager-receiver
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/matrix-alertmanager-receiver
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-alertmanager-receiver
