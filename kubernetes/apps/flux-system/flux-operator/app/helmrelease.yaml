---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      strategy: rollback
  values:
    serviceMonitor:
      create: true
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 512Mi
    web:
      config:
        baseURL: https://flux-operator.melotic.dev
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: https://sso.melotic.dev/application/o/flux-operator/
            autoLogin: true
      httpRoute:
        enabled: true
        hostnames:
          - flux-operator.melotic.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      networkPolicy:
        create: false
  valuesFrom:
    - kind: Secret
      name: flux-operator-oidc
      valuesKey: client-id
      targetPath: web.config.authentication.oauth2.clientID
    - kind: Secret
      name: flux-operator-oidc
      valuesKey: client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
