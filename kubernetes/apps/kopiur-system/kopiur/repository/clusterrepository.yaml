---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
# Adopts the existing VolSync kopia repository; snapshot history is preserved.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: volsync
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /mnt/repository
      volume:
        nfs:
          path: /var/nfs/shared/k8s/volsync
          server: construct.melotic.dev
  concurrency:
    # 16 SnapshotSchedules share this one NFS repository. Uncapped, every app
    # that shares a cron fires at the same instant and every mover uploads at
    # once. Restores bypass this pool, so a cap never delays a recovery.
    maxConcurrentJobs: 2
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: volsync-repository
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 */4 * * *
      full:
        cron: 0 5 * * *
  moverDefaults:
    cache:
      capacity: 8Gi
      storageClassName: ceph-block
    podSecurityContext:
      fsGroup: 988
    securityContext:
      runAsUser: 977
      runAsGroup: 988
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    # Inherited by every consuming cron (SnapshotSchedule, maintenance quick/full,
    # verification, replication) that sets no jitter of its own. Spreads the
    # shared-cron stampede; deterministic per (scheduleUID, slot), so a restart
    # never re-rolls a pinned slot.
    jitter: 30m
    timezone: America/Chicago
