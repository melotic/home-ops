---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-registry-allowlist
  annotations:
    policies.kyverno.io/title: Require Image Registry Allowlist
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must come from an allowlisted registry. Adding a new registry
      to the allowlist requires a PR. Bare-name DockerHub images (no registry prefix)
      are implicitly denied — Renovate normalizes to docker.io/... so no real workload
      regression is expected.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs, replicasets]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(request.namespace in ["kube-system", "kube-public", "kube-node-lease", "kyverno", "flux-system"])
  variables:
    - name: allowlist
      expression: >-
        ["ghcr.io", "quay.io", "mirror.gcr.io", "docker.io", "index.docker.io", "lscr.io",
         "docker.dragonflydb.io", "harbor.melotic.dev", "zot.melotic.dev", "registry.k8s.io",
         "registry.gitlab.com", "code.forgejo.org", "cr.fluentbit.io", "gsoci.azurecr.io",
         "oci.element.io"]
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, variables.allowlist.exists(r, c.image.startsWith(r + '/')))
      message: >-
        Container image must come from an allowlisted registry
        (ghcr.io, quay.io, mirror.gcr.io, docker.io, index.docker.io,
        lscr.io, docker.dragonflydb.io, harbor.melotic.dev, zot.melotic.dev, registry.k8s.io,
        registry.gitlab.com, code.forgejo.org, cr.fluentbit.io, gsoci.azurecr.io,
        oci.element.io).
