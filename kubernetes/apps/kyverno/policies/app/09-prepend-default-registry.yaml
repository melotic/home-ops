---
# Mutation runs before validation, so allowlist 08 sees the prepended image.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: prepend-default-registry
  annotations:
    policies.kyverno.io/title: Prepend Default Registry
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      CI jobs run bare DockerHub images like rust:1.96 that allowlist 08 rejects
      (no registry prefix), so the job never starts. This prepends docker.io/ so it
      passes; no-op when the image already has one. Scoped to gitlab-runner.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gitlab-runner
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.containers) ? [] :
          (lists.range(size(object.spec.containers))
            .filter(i, !object.spec.containers[i].image.contains('/') ||
                       !(object.spec.containers[i].image.split('/')[0].contains('.') ||
                         object.spec.containers[i].image.split('/')[0].contains(':')))
            .map(i, JSONPatch{
              op: "replace",
              path: "/spec/containers/" + string(i) + "/image",
              value: "docker.io/" + object.spec.containers[i].image
            })
          + (has(object.spec.initContainers) ?
            lists.range(size(object.spec.initContainers))
              .filter(i, !object.spec.initContainers[i].image.contains('/') ||
                         !(object.spec.initContainers[i].image.split('/')[0].contains('.') ||
                           object.spec.initContainers[i].image.split('/')[0].contains(':')))
              .map(i, JSONPatch{
                op: "replace",
                path: "/spec/initContainers/" + string(i) + "/image",
                value: "docker.io/" + object.spec.initContainers[i].image
              }) : []))
