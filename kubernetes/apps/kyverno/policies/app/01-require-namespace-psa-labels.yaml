---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-namespace-psa-labels
  annotations:
    policies.kyverno.io/title: Require Namespace PSA Labels
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every user namespace must declare pod-security.kubernetes.io/enforce. This is
      defense-in-depth alongside Kyverno itself; if Kyverno is ever removed, PSA still
      blocks the worst classes of pod misconfigurations.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(object.metadata.name in [
          "kube-system", "kube-public", "kube-node-lease", "kyverno", "flux-system",
          "default", "cilium-secrets", "csi-addons-system"
        ])
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] in
        ['restricted', 'baseline', 'privileged']
      message: "Namespace must set label pod-security.kubernetes.io/enforce (restricted | baseline | privileged)"
