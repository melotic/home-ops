---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    remediation:
      retries: -1
  values:
    crds:
      migration:
        enabled: true
    admissionController:
      replicas: 1
      priorityClassName: system-cluster-critical
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    backgroundController:
      enabled: false
    reportsController:
      enabled: false
    cleanupController:
      enabled: false
    features:
      admissionReports:
        enabled: false
      aggregateReports:
        enabled: false
      policyReports:
        enabled: false
      validatingAdmissionPolicyReports:
        enabled: false
      mutatingAdmissionPolicyReports:
        enabled: false
      reporting:
        validate: false
        mutate: false
        mutateExisting: false
        imageVerify: false
        generate: false
      backgroundScan:
        enabled: false
      policyExceptions:
        enabled: false
