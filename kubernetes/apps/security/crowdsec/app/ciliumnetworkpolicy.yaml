---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CiliumProject/cilium/main/pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnetworkpolicies.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            "k8s:app.kubernetes.io/component": proxy
            "k8s:app.kubernetes.io/managed-by": envoy-gateway
            "k8s:app.kubernetes.io/name": envoy
            "k8s:gateway.envoyproxy.io/owning-gateway-name": envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # WORKAROUND cilium/cilium#47913 (netkit + endpointRoutes + socketLB.hostNamespaceOnly):
    # same-node ClusterIP replies are reverse-NATed before CT lookup and denied as new ingress.
    # Remove once Zion's datapath is veth (Path B).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
            "k8s:app.kubernetes.io/name": crowdsec
    # WORKAROUND cilium/cilium#47913 (netkit + endpointRoutes + socketLB.hostNamespaceOnly):
    # same-node ClusterIP replies are reverse-NATed before CT lookup and denied as new ingress.
    # Remove once Zion's datapath is veth (Path B).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
            "k8s:cnpg.io/poolerName": postgres-cluster-pooler-rw
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            "k8s:app.kubernetes.io/name": prometheus
      toPorts:
        - ports:
            - port: "6060"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
            "k8s:cnpg.io/poolerName": postgres-cluster-pooler-rw
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
            "k8s:app.kubernetes.io/name": crowdsec
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
