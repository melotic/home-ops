---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Zot"
    gethomepage.dev/description: "OCI registry"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/zot-registry.svg"
    gethomepage.dev/href: "https://zot.melotic.dev"
  name: zot
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - zot.melotic.dev
  rules:
    - backendRefs:
        - name: zot
          port: 5000
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 10m
