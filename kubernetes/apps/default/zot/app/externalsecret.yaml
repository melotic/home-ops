---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zot-secret
    template:
      data:
        oidc.json: '{"clientid":"{{ .clientid }}","clientsecret":"{{ .clientsecret }}"}'
  data:
    - secretKey: clientid
      remoteRef:
        key: authentik-oidc
        property: zot_client_id
    - secretKey: clientsecret
      remoteRef:
        key: authentik-oidc
        property: zot_client_secret
