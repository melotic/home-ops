---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: default
spec:
  components:
    - ../../../../components/cnpg-database
  dependsOn:
    - name: postgres
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: ./kubernetes/apps/default/immich/app
  postBuild:
    substitute:
      APP: immich
      PG_DATABASE: immich
      PG_USER: immich
      PG_HOST: postgres-cluster-pooler-rw.database.svc.cluster.local
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
