---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-config
    template:
      engineVersion: v2
      data:
        # Full Immich system config. Presence of IMMICH_CONFIG_FILE disables
        # editing these properties from the web UI (expected, keeps Git the source).
        immich-config.json: |
          {
            "server": { "externalDomain": "https://immich.melotic.dev" },
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://sso.melotic.dev/application/o/immich/",
              "clientId": "immich",
              "clientSecret": "{{ .immich_client_secret }}",
              "scope": "openid email profile",
              "autoRegister": true,
              "autoLaunch": false,
              "buttonText": "Sign in with Authentik",
              "signingAlgorithm": "RS256",
              "profileSigningAlgorithm": "none",
              "tokenEndpointAuthMethod": "client_secret_post",
              "storageLabelClaim": "preferred_username",
              "roleClaim": "immich_role"
            },
            "ffmpeg": { "accel": "qsv", "accelDecode": true },
            "notifications": {
              "smtp": {
                "enabled": true,
                "from": "immich@melotic.dev",
                "replyTo": "",
                "transport": {
                  "host": "smtp-relay.default.svc.cluster.local",
                  "port": 587,
                  "secure": false,
                  "ignoreCert": false,
                  "username": "",
                  "password": ""
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: authentik-oidc
