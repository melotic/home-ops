---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      server:
        # ponytail: pin replica + Recreate; the /data library is a single NFS
        # mount, do not let two servers write it or a stray scale drift to 0.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
            env:
              TZ: America/Chicago
              DB_HOSTNAME: postgres-cluster-rw.database.svc.cluster.local
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                secretKeyRef:
                  name: immich-postgres
                  key: password
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              IMMICH_CONFIG_FILE: /etc/immich-config/immich-config.json
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 2283
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # immich-server (node/tini) writes outside /data at boot; keep the
              # rootfs writable. Non-root + dropped caps are still enforced.
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                # squat.ai/video grants the container cgroup access to
                # /dev/dri/renderD128; the hostPath alone gives EPERM.
                squat.ai/video: 1
              limits:
                memory: 4Gi
                squat.ai/video: 1
      machine-learning:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4
            env:
              TZ: America/Chicago
              TRANSFORMERS_CACHE: /cache
              HF_XET_CACHE: /cache/huggingface-xet
              MPLCONFIGDIR: /cache/matplotlib-config
            probes:
              liveness: &ml-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &ml-port 3003
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *ml-probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # 988 owns the NAS media share; supplemental group lets both the NFS
        # library and the ceph ml-cache PVC stay writable as uid 1000.
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      server:
        controller: server
        ports:
          http:
            port: *port
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *ml-port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "immich.melotic.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port
    persistence:
      # Photo library lives on the NAS media share (same export as
      # jellyfin/plex/sonarr), root-subpath media/photos.
      library:
        type: nfs
        server: construct.melotic.dev
        path: /var/nfs/shared/data
        advancedMounts:
          server:
            app:
              - path: /data
                subPath: media/photos
      # renderD128 is mode 0666, so uid 1000 can do Intel QSV/VAAPI decode.
      dri:
        type: hostPath
        hostPath: /dev/dri
        advancedMounts:
          server:
            app:
              - path: /dev/dri
      config:
        type: secret
        name: immich-config
        advancedMounts:
          server:
            app:
              - path: /etc/immich-config
                readOnly: true
      ml-cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
