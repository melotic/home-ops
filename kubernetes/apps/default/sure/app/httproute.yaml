---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sure"
    gethomepage.dev/description: "Personal finance"
    gethomepage.dev/group: "Finance"
    gethomepage.dev/icon: "sure.png"
    gethomepage.dev/href: "https://sure.melotic.dev"
  name: sure
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - sure.melotic.dev
  rules:
    - backendRefs:
        - name: sure
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
