---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sure-secrets
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: sure-app
        property: SECRET_KEY_BASE
    - secretKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      remoteRef:
        key: sure-app
        property: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - secretKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      remoteRef:
        key: sure-app
        property: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - secretKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      remoteRef:
        key: sure-app
        property: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: sure-app
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: sure-app
        property: OIDC_CLIENT_SECRET
    - secretKey: PLAID_CLIENT_ID
      remoteRef:
        key: sure-app
        property: PLAID_CLIENT_ID
    - secretKey: PLAID_SECRET
      remoteRef:
        key: sure-app
        property: PLAID_SECRET
    - secretKey: OPENAI_ACCESS_TOKEN
      remoteRef:
        key: sure-app
        property: OPENAI_ACCESS_TOKEN
