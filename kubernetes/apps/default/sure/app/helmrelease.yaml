---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
spec:
  interval: 1h
  chart:
    spec:
      chart: sure
      version: 0.7.6
      sourceRef:
        kind: HelmRepository
        name: sure
        namespace: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: sure
    cnpg:
      enabled: false
      cluster:
        enabled: false
    redisOperator:
      enabled: false
    redisSimple:
      enabled: false
    ingress:
      enabled: false
    service:
      type: ClusterIP
      port: 80
    rails:
      env: production
      existingSecret: sure-secrets
      encryptionEnv:
        enabled: true
      settings:
        SELF_HOSTED: "true"
        ONBOARDING_STATE: open
        AI_DEBUG_MODE: "false"
      extraEnv:
        REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/13
        APP_DOMAIN: sure.melotic.dev
        PLAID_ENV: production
        PLAID_INCLUDE_PENDING: "1"
        OIDC_ISSUER: https://sso.melotic.dev/application/o/sure/
        OIDC_REDIRECT_URI: https://sure.melotic.dev/auth/openid_connect/callback
      extraEnvVars:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sure-postgres
              key: uri
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sure-secrets
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: sure-secrets
              key: OIDC_CLIENT_SECRET
        - name: PLAID_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sure-secrets
              key: PLAID_CLIENT_ID
        - name: PLAID_SECRET
          valueFrom:
            secretKeyRef:
              name: sure-secrets
              key: PLAID_SECRET
    web:
      replicas: 1
    worker:
      replicas: 1
