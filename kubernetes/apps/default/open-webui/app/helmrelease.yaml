---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
      version: 15.2.0
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: open-webui
    copyAppData:
      command: ["sh", "-c", "cp -R -n /app/backend/data/. /tmp/app-data/"]
    annotations:
      reloader.stakater.com/auto: "true"
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      enabled: true
      manager: redis
      url: redis://dragonfly.database.svc.cluster.local:6379/4
      redis:
        enabled: false
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: v0.10.2-slim@sha256:f03f7fcdaf5e3381b3d505c0e66f2bf4e82d1918082022b85dee7da1299b6efd
      pullPolicy: IfNotPresent
    replicaCount: 1
    workload:
      kind: Deployment
    strategy:
      type: Recreate
    persistence:
      existingClaim: open-webui-data
    serviceAccount:
      automountServiceAccountToken: false
    route:
      enabled: true
      hostnames:
        - open-webui.melotic.dev
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    enableOpenaiApi: true
    openaiBaseApiUrl: http://llama-swap.default.svc.cluster.local:8080/v1
    openaiApiKey: none
    sso:
      enabled: true
      enableSignup: true
      oidc:
        enabled: true
        clientExistingSecret: open-webui-secret
        clientIdExistingSecretKey: OAUTH_CLIENT_ID
        clientExistingSecretKey: OAUTH_CLIENT_SECRET
        providerUrl: https://sso.melotic.dev/application/o/open-webui/.well-known/openid-configuration
        providerName: authentik
        scopes: openid email profile
    extraEnvVars:
      AIOHTTP_CLIENT_TIMEOUT: "600"
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "30"
      DATABASE_URL:
        valueFrom:
          secretKeyRef:
            name: open-webui-postgres
            key: uri
      DEFAULT_USER_ROLE: pending
      ENABLE_LOGIN_FORM: "false"
      ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
      ENABLE_PASSWORD_AUTH: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_PROFILE_IMAGE_URL_FORWARDING: "false"
      ENABLE_SIGNUP: "false"
      HOME: /tmp
      OAUTH_AUTO_REDIRECT: "true"
      OPENID_REDIRECT_URI: https://open-webui.melotic.dev/oauth/oidc/login/callback
      CHUNK_MIN_SIZE_TARGET: "500"
      CHUNK_OVERLAP: "150"
      CHUNK_SIZE: "1500"
      RAG_EMBEDDING_BATCH_SIZE: "32"
      RAG_EMBEDDING_CONCURRENT_REQUESTS: "1"
      RAG_EMBEDDING_CONTENT_PREFIX: "title: none | text: "
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embeddinggemma
      RAG_EMBEDDING_QUERY_PREFIX: "task: search result | query: "
      RAG_EXTERNAL_RERANKER_API_KEY: none
      RAG_EXTERNAL_RERANKER_TIMEOUT: "60"
      RAG_EXTERNAL_RERANKER_URL: http://llama-swap.default.svc.cluster.local:8080/v1/rerank
      RAG_OPENAI_API_BASE_URL: http://llama-swap.default.svc.cluster.local:8080/v1
      RAG_OPENAI_API_KEY: none
      RAG_RERANKING_ENGINE: external
      RAG_RERANKING_MODEL: bge-rerank
      SEARXNG_QUERY_URL: http://searxng.default.svc.cluster.local:8080/search
      TASK_MODEL_EXTERNAL: task-qwen4b
      WEB_SEARCH_ENGINE: searxng
      WEB_SEARCH_RESULT_COUNT: "3"
      ENABLE_IMAGE_GENERATION: "true"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      ENABLE_WEB_SEARCH: "true"
      IMAGE_GENERATION_ENGINE: openai
      IMAGE_GENERATION_MODEL: z-image
      IMAGES_OPENAI_API_BASE_URL: http://llama-swap.default.svc.cluster.local:8080/v1
      IMAGES_OPENAI_API_KEY: none
      WEBUI_SECRET_KEY:
        valueFrom:
          secretKeyRef:
            name: open-webui-secret
            key: WEBUI_SECRET_KEY
      WEBUI_URL: https://open-webui.melotic.dev
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: false
