---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app open-webui
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/cnpg-database
  dependsOn:
    - name: authentik
      namespace: default
    - name: dragonfly
      namespace: database
    - name: postgres
      namespace: database
    - name: tailscale-policy
      namespace: network
  path: ./kubernetes/apps/default/open-webui/app
  postBuild:
    substitute:
      APP: *app
      ONEPASSWORD_ITEM: open-webui-postgres
      PG_DATABASE: openwebui
      PG_HOST: postgres-cluster-rw.database.svc.cluster.local
      PG_USER: openwebui
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
