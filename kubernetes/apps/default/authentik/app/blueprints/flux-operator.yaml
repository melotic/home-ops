---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Flux Operator OAuth2 Provider and Application
context:
  authorization_flow: &authorization_flow !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  invalidation_flow: &invalidation_flow !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  property_mappings: &property_mappings
    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [name, flux-operator-groups]]
  signing_key: &signing_key !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
entries:
  # The Flux web UI maps the ID token `groups` claim straight onto Kubernetes
  # impersonation groups, so it needs a groups scope mapping.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: flux-operator-groups
    attrs:
      name: flux-operator-groups
      scope_name: groups
      description: Map authentik groups to the ID token groups claim
      expression: |
        return {"groups": [group.name for group in user.all_groups()]}

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: flux-operator
    attrs:
      name: flux-operator
      authorization_flow: *authorization_flow
      invalidation_flow: *invalidation_flow
      client_type: confidential
      client_id: !Env FLUX_OPERATOR_CLIENT_ID
      client_secret: !Env FLUX_OPERATOR_CLIENT_SECRET
      redirect_uris:
        - url: "https://flux-operator.melotic.dev/oauth2/callback"
          matching_mode: strict
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings: *property_mappings
      signing_key: *signing_key

  - model: authentik_core.application
    identifiers:
      slug: flux-operator
    attrs:
      name: Flux Operator
      slug: flux-operator
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, flux-operator]]
      policy_engine_mode: any
      group: Monitoring
      meta_icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/flux/icon/color/flux-icon-color.svg
      meta_description: Flux GitOps control plane web UI
      open_in_new_tab: true
