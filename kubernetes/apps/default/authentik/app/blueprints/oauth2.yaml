---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: OAuth2 Providers and Applications
context:
  scopes: &scopes
    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
    - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  provider: &provider
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    client_type: confidential
    grant_types: [authorization_code, refresh_token]
    property_mappings: *scopes
    signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  app: &app
    policy_engine_mode: any
    open_in_new_tab: true
entries:
  # Flux web UI maps the `groups` claim onto Kubernetes impersonation groups.
  - model: authentik_providers_oauth2.scopemapping
    identifiers: {name: flux-operator-groups}
    attrs:
      scope_name: groups
      description: Map authentik groups to the ID token groups claim
      expression: |
        return {"groups": [group.name for group in user.all_groups()]}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: flux-operator}
    attrs:
      !!merge <<: *provider
      client_id: !Env FLUX_OPERATOR_CLIENT_ID
      client_secret: !Env FLUX_OPERATOR_CLIENT_SECRET
      redirect_uris: [{url: "https://flux-operator.melotic.dev/oauth2/callback", matching_mode: strict}]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, flux-operator-groups]]
  - model: authentik_core.application
    identifiers: {slug: flux-operator}
    attrs:
      !!merge <<: *app
      name: Flux Operator
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, flux-operator]]
      group: Monitoring
      meta_icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/flux/icon/color/flux-icon-color.svg
      meta_description: Flux GitOps control plane web UI

  - model: authentik_core.group
    identifiers: {name: gitlab-admins}
  - model: authentik_providers_oauth2.scopemapping
    identifiers: {name: gitlab-groups}
    attrs:
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in user.all_groups()]}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: gitlab}
    attrs:
      !!merge <<: *provider
      client_id: !Env GITLAB_CLIENT_ID
      client_secret: !Env GITLAB_CLIENT_SECRET
      redirect_uris: [{url: "https://gitlab.melotic.dev/users/auth/openid_connect/callback", matching_mode: strict}]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, gitlab-groups]]
  - model: authentik_core.application
    identifiers: {slug: gitlab}
    attrs:
      !!merge <<: *app
      name: GitLab
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, gitlab]]
      group: Development
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/gitlab.svg
      meta_description: Self-hosted GitLab (internal)
      meta_publisher: GitLab

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: grafana}
    attrs:
      !!merge <<: *provider
      client_id: !Env GRAFANA_CLIENT_ID
      client_secret: !Env GRAFANA_CLIENT_SECRET
      redirect_uris: [{url: "https://grafana.melotic.dev/login/generic_oauth", matching_mode: strict}]
  - model: authentik_core.application
    identifiers: {slug: grafana}
    attrs:
      !!merge <<: *app
      name: Grafana
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana]]
      group: Monitoring
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/grafana.svg
      meta_description: Metrics and dashboards
      meta_publisher: Grafana Labs

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: harbor}
    attrs:
      !!merge <<: *provider
      client_id: !Env HARBOR_CLIENT_ID
      client_secret: !Env HARBOR_CLIENT_SECRET
      redirect_uris: [{url: "https://harbor.melotic.dev/c/oidc/callback", matching_mode: strict}]
  - model: authentik_core.application
    identifiers: {slug: harbor}
    attrs:
      !!merge <<: *app
      name: Harbor
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, harbor]]
      group: Development
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/harbor.svg
      meta_description: Container registry
      meta_publisher: Harbor

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: immich}
    attrs:
      !!merge <<: *provider
      client_id: !Env IMMICH_CLIENT_ID
      client_secret: !Env IMMICH_CLIENT_SECRET
      redirect_uris:
        - {url: "https://immich.melotic.dev/auth/login", matching_mode: strict}
        - {url: "https://immich.melotic.dev/user-settings", matching_mode: strict}
        - {url: "https://immich.melotic.dev/api/oauth/mobile-redirect", matching_mode: strict}
        - {url: "app.immich:///oauth-callback", matching_mode: strict}
  - model: authentik_core.application
    identifiers: {slug: immich}
    attrs:
      !!merge <<: *app
      name: Immich
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, immich]]
      group: Media
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/immich.svg
      meta_description: Photo and video backup
      meta_publisher: Immich

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: karakeep}
    attrs:
      !!merge <<: *provider
      client_id: !Env KARAKEEP_CLIENT_ID
      client_secret: !Env KARAKEEP_CLIENT_SECRET
      redirect_uris: [{url: "https://karakeep.melotic.dev/api/auth/callback/custom", matching_mode: strict}]
  - model: authentik_core.application
    identifiers: {slug: karakeep}
    attrs:
      !!merge <<: *app
      name: Karakeep
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, karakeep]]
      group: Productivity
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/karakeep-light.svg
      meta_description: Bookmark manager
      meta_publisher: Karakeep

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: matrix}
    attrs:
      !!merge <<: *provider
      client_id: !Env MATRIX_CLIENT_ID
      client_secret: !Env MATRIX_CLIENT_SECRET
      redirect_uris: [{url: "https://account.melotic.dev/upstream/callback/01M4SAQHF1HGJXRDAJ7EY3ZFAD", matching_mode: strict}]
  - model: authentik_core.application
    identifiers: {slug: matrix}
    attrs:
      !!merge <<: *app
      name: Matrix
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, matrix]]
      group: Productivity
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/element.svg
      meta_description: Matrix chat homeserver

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: miniflux}
    attrs:
      !!merge <<: *provider
      client_id: !Env MINIFLUX_CLIENT_ID
      client_secret: !Env MINIFLUX_CLIENT_SECRET
      redirect_uris: [{url: "https://reader.melotic.dev/oauth2/oidc/callback", matching_mode: strict}]
  - model: authentik_core.application
    identifiers: {slug: miniflux}
    attrs:
      !!merge <<: *app
      name: Miniflux
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, miniflux]]
      group: Productivity
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/miniflux-light.svg
      meta_description: Feed reader
      meta_publisher: Miniflux

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: open-webui}
    attrs:
      !!merge <<: *provider
      client_id: !Env OPEN_WEBUI_CLIENT_ID
      client_secret: !Env OPEN_WEBUI_CLIENT_SECRET
      redirect_uris:
        - {url: "https://open-webui.melotic.dev/oauth/oidc/login/callback", matching_mode: strict}
        - {url: "https://open-webui.melotic.dev/oauth/oidc/callback", matching_mode: strict}
  - model: authentik_core.application
    identifiers: {slug: open-webui}
    attrs:
      !!merge <<: *app
      name: Open WebUI
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, open-webui]]
      group: Productivity
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/open-webui.svg
      meta_description: Internal chat and RAG interface

  - model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: paperless-ngx}
    attrs:
      !!merge <<: *provider
      client_id: !Env PAPERLESS_CLIENT_ID
      client_secret: !Env PAPERLESS_CLIENT_SECRET
      redirect_uris: [{url: "https://paperless.melotic.dev/accounts/oidc/authentik/login/callback/", matching_mode: strict}]
  - model: authentik_core.application
    identifiers: {slug: paperless}
    attrs:
      !!merge <<: *app
      name: Paperless-ngx
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, paperless-ngx]]
      group: Productivity
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/paperless-ngx-light.svg
      meta_description: Document management system
      meta_publisher: Paperless-ngx
