---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Embedded Proxy Outpost
context:
  authorization_flow: &authorization_flow !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  invalidation_flow: &invalidation_flow !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
entries:
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: alertmanager
    attrs:
      name: alertmanager
      authorization_flow: *authorization_flow
      invalidation_flow: *invalidation_flow
      mode: forward_single
      external_host: https://alertmanager.melotic.dev
  - model: authentik_core.application
    identifiers:
      slug: alertmanager
    attrs:
      name: Alertmanager
      slug: alertmanager
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, alertmanager]]
      policy_engine_mode: any
      group: Monitoring
      meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/alertmanager.svg
      meta_description: Alert routing and management
      open_in_new_tab: true
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: firefly
    attrs:
      name: firefly
      authorization_flow: *authorization_flow
      invalidation_flow: *invalidation_flow
      mode: forward_single
      external_host: https://firefly.melotic.dev
  - model: authentik_core.application
    identifiers:
      slug: firefly
    attrs:
      name: Firefly III
      slug: firefly
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, firefly]]
      policy_engine_mode: any
      group: Productivity
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/firefly-iii.svg
      meta_description: Personal finance manager
      open_in_new_tab: true
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: gatus
    attrs:
      name: gatus
      authorization_flow: *authorization_flow
      invalidation_flow: *invalidation_flow
      mode: forward_single
      external_host: https://status.melotic.dev
  - model: authentik_core.application
    identifiers:
      slug: gatus
    attrs:
      name: gatus
      slug: gatus
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, gatus]]
      policy_engine_mode: any
      group: Monitoring
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/gatus.svg
      meta_description: Uptime monitoring
      open_in_new_tab: true
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: victoria-logs
    attrs:
      name: victoria-logs
      authorization_flow: *authorization_flow
      invalidation_flow: *invalidation_flow
      mode: forward_single
      external_host: https://victoria-logs.melotic.dev
  - model: authentik_core.application
    identifiers:
      slug: victoria-logs
    attrs:
      name: VictoriaLogs
      slug: victoria-logs
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, victoria-logs]]
      policy_engine_mode: any
      group: Monitoring
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/victoriametrics.svg
      meta_description: Log management and storage
      open_in_new_tab: true

  # Authentik replaces, rather than appends, this provider set. Keep every
  # embedded-proxy provider here so application blueprints cannot silently
  # remove a sibling from the outpost.
  - model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      managed: "goauthentik.io/outposts/embedded"
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, alertmanager]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, firefly]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, gatus]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, victoria-logs]]

  - model: authentik_outposts.outpost
    identifiers:
      name: ghidra-server-ldap
    attrs:
      name: ghidra-server-ldap
      type: ldap
      service_connection: !Find [authentik_outposts.outpostserviceconnection, [name, "Local Kubernetes Cluster"]]
      providers:
        - !Find [authentik_core.provider, [name, ghidra-ldap]]
      config:
        log_level: info
        authentik_host: https://sso.melotic.dev
        object_naming_template: ak-outpost-%(name)s
        kubernetes_json_patches:
          service:
            - op: add
              path: /metadata/annotations
              value:
                external-dns.alpha.kubernetes.io/hostname: ghidra-ldap.melotic.dev
            - op: add
              path: /spec/loadBalancerSourceRanges
              value:
                - 10.42.0.0/16
                - 10.60.0.0/16
        kubernetes_namespace: default
        kubernetes_replicas: 1
        kubernetes_service_type: LoadBalancer
