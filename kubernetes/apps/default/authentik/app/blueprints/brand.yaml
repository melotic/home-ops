---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: melotic Brand
  labels:
    blueprints.goauthentik.io/description: "Matrix-themed branding for sso.melotic.dev"
entries:
  # Apply auth flow blueprint first so the flow exists for the !Find below
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: melotic Authentication Flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - User settings flow
      required: false

  - model: authentik_brands.brand
    identifiers:
      domain: sso.melotic.dev
    state: present
    attrs:
      domain: sso.melotic.dev
      default: false
      branding_title: melotic
      branding_logo: "zion.svg"
      branding_favicon: "zion.svg"
      branding_default_flow_background: "background.svg"

      flow_authentication: !Find [authentik_flows.flow, [slug, melotic-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      attributes:
        settings:
          theme:
            base: dark
      branding_custom_css: |-
        /* melotic: matrix-green accent on authentik's dark theme; terminal styling on the login card only */
        :root, :host, :host([theme="dark"]), html[data-theme="dark"] {
          color-scheme: dark;
          --zion-green: #00ff41;
          --zion-green-hover: #6dff98;
          --zion-text: #cdf7d8;
          --zion-muted: #79b58b;
          --zion-line: #14492a;
          --zion-panel: #050f09;
          --zion-mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;

          --ak-accent: var(--zion-green);
          --pf-global--primary-color--100: var(--zion-green);
          --pf-global--primary-color--200: var(--zion-green-hover);
          --pf-global--active-color--100: var(--zion-green);
          --pf-global--active-color--400: var(--zion-green);
          --pf-global--link--Color: var(--zion-green);
          --pf-global--link--Color--hover: var(--zion-green-hover);
          --pf-global--link--Color--visited: var(--zion-green);
          --pf-global--link--Color--light: var(--zion-green);
          --pf-global--link--Color--light--hover: var(--zion-green-hover);
          --pf-global--link--Color--dark: var(--zion-green);
          --pf-global--link--Color--dark--hover: var(--zion-green-hover);
          --pf-global--primary-color--light-100: var(--zion-green);
          --pf-global--primary-color--dark-100: var(--zion-green);
          --pf-global--Color--100: var(--zion-text);
          --pf-global--Color--200: var(--zion-muted);
          --pf-global--BorderColor--100: var(--zion-line);
          --pf-global--BackgroundColor--100: var(--zion-panel);
          --pf-global--BackgroundColor--200: #000;
          --pf-global--BackgroundColor--150: var(--zion-panel);
          --pf-global--BackgroundColor--light-100: var(--zion-panel);
          --pf-global--BackgroundColor--300: #0a1a10;
          --pf-global--BackgroundColor--400: #0e2416;
          --pf-global--BackgroundColor--dark-100: var(--zion-panel);
          --pf-global--BackgroundColor--dark-200: #000;
          --pf-c-page__sidebar--BackgroundColor: var(--zion-panel);
          --pf-c-page__header--BackgroundColor: var(--zion-panel);
          --ak-dark-background: #000;
          --ak-dark-background-light: var(--zion-panel);
          --ak-dark-background-lighter: #0a1a10;
        }

        /* doubled class outranks authentik's component defaults, which load after this sheet */
        .pf-c-button.pf-c-button,
        .pf-c-dropdown.pf-c-dropdown {
          --pf-c-dropdown__toggle--m-primary--Color: #001a08;
          --pf-c-dropdown__toggle--m-primary--hover--Color: #001a08;
          --pf-c-button--m-primary--Color: #001a08;
          --pf-c-button--m-primary--hover--Color: #001a08;
          --pf-c-button--m-primary--active--Color: #001a08;
          --pf-c-button--m-primary--BackgroundColor: var(--zion-green);
          --pf-c-button--m-primary--hover--BackgroundColor: var(--zion-green-hover);
          --pf-c-button--m-primary--active--BackgroundColor: var(--zion-green-hover);
          --pf-c-button--m-secondary--Color: var(--zion-green);
          --pf-c-button--m-secondary--after--BorderColor: var(--zion-green);
          --pf-c-button--m-secondary--hover--Color: var(--zion-green-hover);
          --pf-c-button--m-secondary--hover--after--BorderColor: var(--zion-green-hover);
        }

        .pf-c-form-control:focus,
        .pf-c-form-control:focus-visible {
          outline: none;
          border-color: var(--zion-green);
          box-shadow: 0 0 0 1px var(--zion-green), 0 0 12px rgba(0, 255, 65, 0.25);
        }

        /* ---- login card --------------------------------------------------- */
        ak-locale-select { display: none; }

        .pf-c-login__main {
          --pf-global--FontFamily--text: var(--zion-mono);
          --pf-global--FontFamily--heading: var(--zion-mono);
          font-family: var(--zion-mono);
          background: rgba(3, 12, 7, 0.94);
          border: 1px solid var(--zion-line);
          border-radius: 8px;
          overflow: hidden;
          padding-top: 2rem;
          box-shadow: 0 0 32px rgba(0, 255, 65, 0.12), 0 24px 64px rgba(0, 0, 0, 0.8);
        }
        .pf-c-login__main::before {
          content: "zion@matrix:~/auth$";
          position: absolute;
          inset: 0 0 auto;
          height: 2rem;
          display: flex;
          align-items: center;
          padding-inline: 1rem;
          font-size: 0.75rem;
          color: var(--zion-muted);
          background: #020a05;
          border-bottom: 1px solid var(--zion-line);
        }
        .pf-c-login__main-header .pf-c-title { font-family: var(--zion-mono); }
        .pf-c-login__main-header .pf-c-title::before { content: "> "; color: var(--zion-green); }
        .pf-c-login__main-header.pf-c-brand { display: flex; justify-content: center; }
        .pf-c-login__main-header .branding-logo { max-width: 240px; max-height: 96px; }
        .pf-c-login__footer { color: var(--zion-muted); }
