---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./referencegrant.yaml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - ./blueprints/brand.yaml
      - ./blueprints/cloudflare-access.yaml
      - ./blueprints/flow-login.yaml
      - ./blueprints/ghidra-server.yaml
      - ./blueprints/groups.yaml
      - ./blueprints/oauth2.yaml
      - ./blueprints/outpost.yaml
      - ./blueprints/reputation.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
