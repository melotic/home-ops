---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Zion
    description: Homelab dashboard
    favicon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/homepage.png
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
    layout:
      Media:
        style: row
        columns: 2
        icon: mdi-play-circle
      Apps:
        style: row
        columns: 2
        icon: mdi-application
      Platform:
        style: row
        columns: 2
        icon: mdi-server-network
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
  services.yaml: |
    []
  widgets.yaml: |-
    - search:
        provider: duckduckgo
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Zion
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
