---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Zion
    description: Homelab dashboard
    theme: dark
    color: slate
    headerStyle: boxed
    iconStyle: theme
    statusStyle: dot
    fullWidth: true
    maxGroupColumns: 8
    useEqualHeights: true
    disableCollapse: true
    hideVersion: true
    layout:
      - Media: {}
      - Apps: {}
      - Platform: {}
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
  services.yaml: |
    []
  widgets.yaml: |-
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Zion
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
