---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-terminal
spec:
  chartRef:
    kind: OCIRepository
    name: open-terminal
  interval: 1h
  values:
    controllers:
      open-terminal:
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-terminal
              tag: openshift@sha256:998a9703f7676396a0da9ac2354046cb397ef611038443428e585f8907a3858e
            env:
              OPEN_TERMINAL_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-terminal-secret
                    key: OPEN_TERMINAL_API_KEY
              OPEN_TERMINAL_EXECUTE_TIMEOUT: "120"
              TZ: America/Chicago
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      home:
        type: emptyDir
        globalMounts:
          - path: /home/user
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
