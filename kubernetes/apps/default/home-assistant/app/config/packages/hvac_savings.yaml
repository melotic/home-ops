---
# Comfort-per-dollar HVAC plan. Loaded via `homeassistant: packages:` in
# configuration.yaml, mounted read-only from the home-assistant-packages ConfigMap.
#
# Ground rules:
#   * Home and Sleep comfort settings are never raised to save money. The only
#     setback is while the house is empty.
#   * The ecobee owns the schedule. HA only applies away holds, resumes the
#     program, and runs failsafes, so a Zion outage leaves a sane schedule.
#   * Entity IDs are the ecobee-cloud ones (HomeKit is not paired).
#   * Never write a dollar-brace substitution marker in this file. Flux postBuild
#     substitution runs over the rendered ConfigMap and fails the Kustomization on it.

input_number:
  hvac_pet_failsafe_hot:
    name: Pet failsafe – max indoor temp
    min: 80
    max: 88
    step: 1
    unit_of_measurement: "°F"
    initial: 84 # `initial` = git is authoritative; UI edits revert on restart
  hvac_pet_failsafe_cold:
    name: Pet failsafe – min indoor temp
    min: 50
    max: 65
    step: 1
    unit_of_measurement: "°F"
    initial: 60
  marginal_rate_summer:
    name: CPS marginal rate Jun–Sep
    min: 0
    max: 0.5
    step: 0.001
    unit_of_measurement: "USD/kWh"
    initial: 0.14 # replace with the value derived from a real bill
  marginal_rate_offpeak:
    name: CPS marginal rate Oct–May
    min: 0
    max: 0.5
    step: 0.001
    unit_of_measurement: "USD/kWh"
    initial: 0.12
  main_floor_cooling_kw:
    name: Main floor cooling draw
    min: 0
    max: 10
    step: 0.05
    unit_of_measurement: kW
    initial: 3.0 # condenser tons × 12 / EER
  main_floor_blower_kw:
    name: Main floor blower draw
    min: 0
    max: 2
    step: 0.05
    unit_of_measurement: kW
    initial: 0.4 # air-handler nameplate V × FLA × ~0.7
  main_floor_filter_interval_h:
    name: Main floor filter interval
    min: 100
    max: 2000
    step: 50
    unit_of_measurement: h
    initial: 500
  upstairs_cooling_kw:
    name: Upstairs cooling draw
    min: 0
    max: 10
    step: 0.05
    unit_of_measurement: kW
    initial: 2.5
  upstairs_blower_kw:
    name: Upstairs blower draw
    min: 0
    max: 2
    step: 0.05
    unit_of_measurement: kW
    initial: 0.4
  upstairs_filter_interval_h:
    name: Upstairs filter interval
    min: 100
    max: 2000
    step: 50
    unit_of_measurement: h
    initial: 500
  hvac_recovery_distance:
    name: Start recovery when this close to home
    min: 1
    max: 50
    step: 1
    unit_of_measurement: mi # match the proximity sensor's unit
    initial: 15

input_boolean:
  hvac_optimizations:
    name: HVAC optimizations enabled
    # No `initial`: the state survives restarts and the switchback owns it.
  hvac_experiment:
    name: HVAC switchback experiment running

script:
  hvac_apply_baseline:
    alias: HVAC – apply ecobee baseline settings
    sequence:
      - action: number.set_value
        target:
          entity_id:
            - number.main_floor_fan_minimum_on_time
            - number.upstairs_fan_minimum_on_time
        data:
          # 0 when optimizing; 5 (the previous setting) on control days.
          value: "{{ 0 if is_state('input_boolean.hvac_optimizations', 'on') else 5 }}"
      - action: ecobee.set_occupancy_modes
        data:
          entity_id:
            - climate.main_floor
            - climate.upstairs
          auto_away: false # motion-based away is defeated by the cat
          follow_me: false

template:
  - binary_sensor:
      - name: House occupied
        unique_id: house_occupied
        state: >
          {% set occupants = ['person.justin'] %}
          {{ occupants | select('is_state', 'home') | list | count > 0 }}
        delay_off: "00:10:00" # absorbs GPS flaps
  - sensor:
      # Prometheus does not export `weather` entities, so republish the met.no
      # current temperature as a sensor. It is in °C with no device_class, so HA
      # will not auto-convert it and the exported value is unambiguous.
      - name: Outdoor temperature
        unique_id: outdoor_temperature
        unit_of_measurement: "°C"
        state_class: measurement
        availability: "{{ state_attr('weather.forecast_home', 'temperature') is number }}"
        state: >
          {% set t = state_attr('weather.forecast_home', 'temperature') | float %}
          {% if state_attr('weather.forecast_home', 'temperature_unit') == '°C' %}{{ t | round(2) }}
          {% else %}{{ ((t - 32) * 5 / 9) | round(2) }}{% endif %}
      - name: Main floor HVAC action
        unique_id: main_floor_hvac_action
        state: "{{ state_attr('climate.main_floor', 'hvac_action') }}"
      - name: Main floor HVAC power
        unique_id: main_floor_hvac_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {% set a = state_attr('climate.main_floor', 'hvac_action') %}
          {% if a == 'cooling' %}{{ states('input_number.main_floor_cooling_kw') | float(0) }}
          {% elif a in ['fan', 'heating'] %}{{ states('input_number.main_floor_blower_kw') | float(0) }}
          {% else %}0{% endif %}
        # For a heat pump, give 'heating' its own compressor kW.
      - name: Main floor blower running
        unique_id: main_floor_blower_running
        state: >
          {{ 1 if state_attr('climate.main_floor', 'hvac_action') in ['cooling', 'heating', 'fan'] else 0 }}
      - name: Upstairs HVAC action
        unique_id: upstairs_hvac_action
        state: "{{ state_attr('climate.upstairs', 'hvac_action') }}"
      - name: Upstairs HVAC power
        unique_id: upstairs_hvac_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {% set a = state_attr('climate.upstairs', 'hvac_action') %}
          {% if a == 'cooling' %}{{ states('input_number.upstairs_cooling_kw') | float(0) }}
          {% elif a in ['fan', 'heating'] %}{{ states('input_number.upstairs_blower_kw') | float(0) }}
          {% else %}0{% endif %}
      - name: Upstairs blower running
        unique_id: upstairs_blower_running
        state: >
          {{ 1 if state_attr('climate.upstairs', 'hvac_action') in ['cooling', 'heating', 'fan'] else 0 }}
      - name: CPS marginal rate
        unique_id: cps_marginal_rate
        unit_of_measurement: "USD/kWh"
        state: >
          {{ states('input_number.marginal_rate_summer') if now().month in [6, 7, 8, 9]
             else states('input_number.marginal_rate_offpeak') }}
      - name: HVAC cost this month
        unique_id: hvac_cost_this_month
        unit_of_measurement: USD
        state: >
          {% set kwh = states('sensor.main_floor_hvac_energy_monthly') | float(0)
                     + states('sensor.upstairs_hvac_energy_monthly') | float(0) %}
          {{ (kwh * states('sensor.cps_marginal_rate') | float(0)) | round(2) }}

sensor:
  - platform: integration
    name: Main floor HVAC energy
    unique_id: main_floor_hvac_energy
    source: sensor.main_floor_hvac_power
    method: left # step-shaped on/off power
    round: 3
  - platform: integration
    name: Main floor blower hours total
    unique_id: main_floor_blower_hours_total
    source: sensor.main_floor_blower_running
    unit_time: h
    method: left
    round: 2
  - platform: history_stats
    name: Main floor cooling hours today
    entity_id: sensor.main_floor_hvac_action
    state: cooling
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: integration
    name: Upstairs HVAC energy
    unique_id: upstairs_hvac_energy
    source: sensor.upstairs_hvac_power
    method: left
    round: 3
  - platform: integration
    name: Upstairs blower hours total
    unique_id: upstairs_blower_hours_total
    source: sensor.upstairs_blower_running
    unit_time: h
    method: left
    round: 2
  - platform: history_stats
    name: Upstairs cooling hours today
    entity_id: sensor.upstairs_hvac_action
    state: cooling
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

utility_meter:
  main_floor_hvac_energy_monthly:
    source: sensor.main_floor_hvac_energy
    cycle: monthly
  main_floor_filter_hours: # utility_meter.calibrate → 0 after a filter swap
    source: sensor.main_floor_blower_hours_total
  upstairs_hvac_energy_monthly:
    source: sensor.upstairs_hvac_energy
    cycle: monthly
  upstairs_filter_hours:
    source: sensor.upstairs_blower_hours_total

automation:
  # --- Baseline enforced on every start ------------------------------------
  - id: hvac_enforce_baseline
    alias: HVAC – enforce ecobee baseline on start
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:02:00" # let the ecobee integration load
      - action: script.hvac_apply_baseline

  - id: hvac_flag_changed
    alias: HVAC – re-apply baseline when optimizations flip
    triggers:
      - trigger: state
        entity_id: input_boolean.hvac_optimizations
    actions:
      - action: script.hvac_apply_baseline

  # --- Switchback experiment -----------------------------------------------
  # While hvac_experiment is on, randomize ON/OFF daily at 03:00. When it is
  # off, optimizations stay ON. Random (not alternating) days keep weekdays and
  # weekends balanced across both arms.
  - id: hvac_switchback
    alias: HVAC – switchback daily flip
    triggers:
      - trigger: time
        at: "03:00:00"
      - trigger: state
        entity_id: input_boolean.hvac_experiment
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.hvac_experiment
            state: "on"
          - condition: template
            value_template: "{{ [true, false] | random }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hvac_optimizations
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.hvac_optimizations

  # --- Missed resume: home but still holding Away ---------------------------
  - id: hvac_missed_resume
    alias: HVAC – resume if home with an away hold
    triggers:
      - trigger: state
        entity_id: binary_sensor.house_occupied
        to: "on"
        for: "00:20:00"
    conditions:
      - condition: template
        value_template: >
          {{ is_state_attr('climate.main_floor', 'preset_mode', 'away_indefinitely')
             or is_state_attr('climate.upstairs', 'preset_mode', 'away_indefinitely') }}
    actions:
      - action: ecobee.resume_program
        data:
          entity_id:
            - climate.main_floor
            - climate.upstairs
          resume_all: true
      - action: notify.mobile_app_70656e6973
        data:
          message: "You've been home 20 min with an away hold still active; resumed the schedule. Check the approach automation."

  # --- Away setback --------------------------------------------------------
  - id: hvac_away_when_empty
    alias: HVAC – away when house empty
    triggers:
      - trigger: state
        entity_id: binary_sensor.house_occupied
        to: "off"
        for: "00:05:00"
    conditions:
      - condition: state # control days of the experiment skip the setback
        entity_id: input_boolean.hvac_optimizations
        state: "on"
    actions:
      - action: climate.set_preset_mode
        target:
          entity_id:
            - climate.main_floor
            - climate.upstairs
        data:
          preset_mode: away_indefinitely # holds at the ecobee Away comfort setting until resumed

  # --- Arrive comfortable: resume while heading home -----------------------
  - id: hvac_resume_on_approach
    alias: HVAC – resume schedule when heading home
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.home_justin_distance
        below: input_number.hvac_recovery_distance
      - trigger: state # fallback if proximity missed it
        entity_id: binary_sensor.house_occupied
        to: "on"
    conditions:
      - condition: template # only if an away hold is active
        value_template: >
          {{ is_state_attr('climate.main_floor', 'preset_mode', 'away_indefinitely')
             or is_state_attr('climate.upstairs', 'preset_mode', 'away_indefinitely') }}
      - condition: or
        conditions:
          - condition: state
            entity_id: sensor.home_justin_direction_of_travel
            state: towards
          - condition: state
            entity_id: binary_sensor.house_occupied
            state: "on"
    actions:
      - action: ecobee.resume_program
        data:
          entity_id:
            - climate.main_floor
            - climate.upstairs
          resume_all: true

  # --- Pet failsafes -------------------------------------------------------
  - id: hvac_pet_failsafe_hot
    alias: HVAC – pet failsafe (too hot while away)
    triggers:
      - trigger: numeric_state
        entity_id:
          - climate.main_floor
          - climate.upstairs
        attribute: current_temperature
        above: input_number.hvac_pet_failsafe_hot
        for: "00:15:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.house_occupied
        state: "off"
    actions:
      - action: climate.set_temperature
        target:
          entity_id: "{{ trigger.entity_id }}"
        data:
          hvac_mode: cool
          temperature: 80 # in heat_cool mode, use target_temp_high instead
      - action: notify.mobile_app_70656e6973
        data:
          message: >
            {{ trigger.to_state.name }} hit {{ trigger.to_state.attributes.current_temperature }}°F
            while away; forced cool to 80°F.

  - id: hvac_pet_failsafe_cold
    alias: HVAC – pet failsafe (too cold while away)
    triggers:
      - trigger: numeric_state
        entity_id:
          - climate.main_floor
          - climate.upstairs
        attribute: current_temperature
        below: input_number.hvac_pet_failsafe_cold
        for: "00:15:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.house_occupied
        state: "off"
    actions:
      - action: climate.set_temperature
        target:
          entity_id: "{{ trigger.entity_id }}"
        data:
          hvac_mode: heat
          temperature: 65
      - action: notify.mobile_app_70656e6973
        data:
          message: "{{ trigger.to_state.name }} dropped below the cold failsafe while away; forced heat to 65°F."

  # --- Aux heat alert (meaningful only if the system is a heat pump) --------
  - id: hvac_aux_heat_alert
    alias: HVAC – aux heat running in mild weather
    triggers:
      - trigger: template
        value_template: >
          {{ 'auxHeat' in (state_attr('climate.main_floor', 'equipment_running') or '')
             or 'auxHeat' in (state_attr('climate.upstairs', 'equipment_running') or '') }}
    conditions:
      - condition: numeric_state
        entity_id: weather.main_floor
        attribute: temperature
        above: 40
    actions:
      - action: notify.mobile_app_70656e6973
        data:
          message: >
            Aux (strip) heat is running at {{ state_attr('weather.main_floor', 'temperature') }}°F
            outside. Check the aux/compressor thresholds in the ecobee app.

  # --- Filter due ----------------------------------------------------------
  - id: hvac_filter_due_main_floor
    alias: HVAC – main floor filter due
    triggers:
      - trigger: numeric_state
        entity_id: sensor.main_floor_filter_hours
        above: input_number.main_floor_filter_interval_h
    actions:
      - action: notify.mobile_app_70656e6973
        data:
          message: >
            Main floor filter due ({{ states('sensor.main_floor_filter_hours') }} blower-hours).
            After swapping, calibrate sensor.main_floor_filter_hours to 0.

  - id: hvac_filter_due_upstairs
    alias: HVAC – upstairs filter due
    triggers:
      - trigger: numeric_state
        entity_id: sensor.upstairs_filter_hours
        above: input_number.upstairs_filter_interval_h
    actions:
      - action: notify.mobile_app_70656e6973
        data:
          message: >
            Upstairs filter due ({{ states('sensor.upstairs_filter_hours') }} blower-hours).
            After swapping, calibrate sensor.upstairs_filter_hours to 0.

  # --- Weekly cost report --------------------------------------------------
  - id: hvac_weekly_report
    alias: HVAC – weekly cost report
    triggers:
      - trigger: time
        at: "19:00:00"
    conditions:
      - condition: time
        weekday: [sun]
    actions:
      - action: notify.mobile_app_70656e6973
        data:
          message: >-
            HVAC month-to-date: {{ (states('sensor.main_floor_hvac_energy_monthly') | float(0)
              + states('sensor.upstairs_hvac_energy_monthly') | float(0)) | round(1) }} kWh
            ≈ {{ states('sensor.hvac_cost_this_month') }} USD.
