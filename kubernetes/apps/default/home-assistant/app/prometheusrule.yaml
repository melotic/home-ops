---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
#
# Turns raw Home Assistant metrics into HVAC KPIs, a weather-normalized savings
# estimate, and inefficiency alerts. Consumed by hvac-dashboard.json and hvac_mv.py.
#
# Metric names assume `prometheus: namespace: homeassistant` plus the overrides in
# config/configuration.yaml. All HA temperatures arrive in °C.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hvac
spec:
  groups:
    # ------------------------------------------------------------------
    # Constants that live in git. Edit, commit, Flux applies.
    # ------------------------------------------------------------------
    - name: hvac.constants
      interval: 5m
      rules:
        # Nameplate estimates. Keep in sync with the HA input_numbers until real
        # CT-clamp power replaces both.
        - record: hvac:cooling_kw
          expr: vector(3.0)
          labels: {entity: climate.main_floor}
        - record: hvac:cooling_kw
          expr: vector(2.5)
          labels: {entity: climate.upstairs}
        - record: hvac:blower_kw
          expr: vector(0.4)
          labels: {entity: climate.main_floor}
        - record: hvac:blower_kw
          expr: vector(0.4)
          labels: {entity: climate.upstairs}
        # Marginal $/kWh from the bill: off-season plus the summer tier adder.
        # month() is UTC; the few hours of skew at month boundaries don't matter.
        - record: hvac:marginal_rate_usd_per_kwh
          expr: vector(0.12) + 0.02 * ((month() >= bool 6) * (month() <= bool 9))
        # Weather-normalized baseline, fitted by hvac_mv.py on OFF days:
        #   expected cooling hours/day = intercept + slope * CDH
        # Slope 0 = not fitted yet; savings rules stay empty until it's > 0.
        - record: hvac:baseline_intercept_h
          expr: vector(0)
          labels: {entity: climate.main_floor}
        - record: hvac:baseline_slope_h_per_cdh
          expr: vector(0)
          labels: {entity: climate.main_floor}
        - record: hvac:baseline_intercept_h
          expr: vector(0)
          labels: {entity: climate.upstairs}
        - record: hvac:baseline_slope_h_per_cdh
          expr: vector(0)
          labels: {entity: climate.upstairs}

    # ------------------------------------------------------------------
    # Per-minute state, normalized to one series per thermostat.
    # ------------------------------------------------------------------
    - name: hvac.instant
      interval: 1m
      rules:
        - record: hvac:outdoor_temp_f
          expr: max(homeassistant_outdoor_temperature_celsius) * 9 / 5 + 32
        - record: hvac:cooling_active
          expr: max by (entity) (homeassistant_climate_action{action="cooling"})
        - record: hvac:heating_active
          expr: max by (entity) (homeassistant_climate_action{action="heating"})
        - record: hvac:fan_only_active
          expr: max by (entity) (homeassistant_climate_action{action="fan"})
        - record: hvac:occupied
          expr: max(homeassistant_binary_sensor_state{entity="binary_sensor.house_occupied"})
        - record: hvac:optimizations_on
          expr: max(homeassistant_input_boolean_state{entity="input_boolean.hvac_optimizations"})
        # Positive = warmer than setpoint. Empty in heat_cool mode (no single target).
        - record: hvac:setpoint_error_f
          expr: |
            (max by (entity) (homeassistant_climate_current_temperature_celsius)
              - max by (entity) (homeassistant_climate_target_temperature_celsius)) * 9 / 5
        - record: hvac:comfort_in_band
          expr: abs(hvac:setpoint_error_f) <= bool 1
        - record: hvac:indoor_humidity_pct
          expr: max by (entity) (homeassistant_indoor_humidity_percent)

    # ------------------------------------------------------------------
    # Rolling 24h KPIs. Query at 03:00 local for "calendar" days that line up
    # with the switchback flip (hvac_mv.py does this).
    # ------------------------------------------------------------------
    - name: hvac.daily
      interval: 5m
      rules:
        - record: hvac:cooling_hours:24h
          expr: avg_over_time(hvac:cooling_active[24h]) * 24
        - record: hvac:heating_hours:24h
          expr: avg_over_time(hvac:heating_active[24h]) * 24
        - record: hvac:fan_only_hours:24h
          expr: avg_over_time(hvac:fan_only_active[24h]) * 24
        # Cooling/heating degree-hours, base 65°F, hourly samples.
        - record: hvac:cdh:24h
          expr: sum_over_time(clamp_min(hvac:outdoor_temp_f - 65, 0)[24h:1h])
        - record: hvac:hdh:24h
          expr: sum_over_time(clamp_min(65 - hvac:outdoor_temp_f, 0)[24h:1h])
        # Efficiency index: runtime per unit of weather. Lower = better.
        # Suppressed on mild days where the ratio is noise.
        - record: hvac:cooling_hours_per_100cdh:24h
          expr: (hvac:cooling_hours:24h * 100 / scalar(hvac:cdh:24h)) and on() (hvac:cdh:24h > 50)
        - record: hvac:heating_hours_per_100hdh:24h
          expr: (hvac:heating_hours:24h * 100 / scalar(hvac:hdh:24h)) and on() (hvac:hdh:24h > 50)
        # Estimated energy and cost. Heating counts blower only (gas assumption);
        # swap in compressor kW if it turns out to be a heat pump.
        - record: hvac:kwh:24h
          expr: |
            hvac:cooling_hours:24h * on(entity) hvac:cooling_kw
              + on(entity) hvac:fan_only_hours:24h * on(entity) hvac:blower_kw
              + on(entity) hvac:heating_hours:24h * on(entity) hvac:blower_kw
        - record: hvac:cost_usd:24h
          expr: hvac:kwh:24h * scalar(hvac:marginal_rate_usd_per_kwh)
        # Comfort: share of OCCUPIED minutes within ±1°F of setpoint.
        - record: hvac:comfort_ratio:24h
          expr: |
            (
              sum_over_time((hvac:comfort_in_band * on() group_left() hvac:occupied)[24h:1m])
                / scalar(sum_over_time(hvac:occupied[24h]))
            ) and on() (sum_over_time(hvac:occupied[24h]) > 60)
        # Humidity: share of occupied minutes above 55% RH, per humidity sensor.
        - record: hvac:humid_ratio:24h
          expr: |
            (
              sum_over_time(((hvac:indoor_humidity_pct > bool 55) * on() group_left() hvac:occupied)[24h:1m])
                / scalar(sum_over_time(hvac:occupied[24h]))
            ) and on() (sum_over_time(hvac:occupied[24h]) > 60)
        # Savings vs the fitted baseline (empty until the slope is > 0).
        - record: hvac:expected_cooling_hours:24h
          expr: |
            (hvac:baseline_intercept_h + on(entity) hvac:baseline_slope_h_per_cdh * scalar(hvac:cdh:24h))
              and on(entity) (hvac:baseline_slope_h_per_cdh > 0)
        - record: hvac:savings_usd:24h
          expr: |
            (hvac:expected_cooling_hours:24h - on(entity) hvac:cooling_hours:24h)
              * on(entity) hvac:cooling_kw
              * scalar(hvac:marginal_rate_usd_per_kwh)

    # ------------------------------------------------------------------
    # Inefficiency detectors.
    # severity=warning/error reaches the webhook receiver; severity=info is
    # blackholed by the AlertmanagerConfig route, so info alerts are advisory
    # only (visible in Alertmanager, not pushed).
    # ------------------------------------------------------------------
    - name: hvac.alerts
      rules:
        - alert: HvacMetricsMissing
          expr: absent(homeassistant_climate_action)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: HA HVAC metrics are missing; the dashboard and savings numbers are blind.
        - alert: HvacSystemsFighting
          expr: (max(hvac:cooling_active) == 1) and on() (max(hvac:heating_active) == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: One floor is heating while the other cools. Narrow the gap between the floors' setpoints or lock one to cool-only for the season.
        - alert: HvacFanOnlyRuntime
          expr: hvac:fan_only_hours:24h > 1
          for: 1h
          labels: {severity: info}
          annotations:
            summary: "{{ $labels.entity }} ran fan-only {{ $value | printf \"%.1f\" }} h in 24h. Fan min-on-time or a manual fan hold crept back."
        - alert: HvacEfficiencyDrift
          expr: hvac:cooling_hours_per_100cdh:24h > 1.25 * avg_over_time(hvac:cooling_hours_per_100cdh:24h[30d])
          for: 2d
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.entity }} needs 25%+ more runtime per unit of heat than its 30-day norm. Check filter, coil, refrigerant."
        - alert: HvacComfortDegraded
          expr: hvac:comfort_ratio:24h < 0.85
          for: 6h
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.entity }} spent >15% of occupied time more than 1°F off setpoint. An optimization went too far or the unit can't keep up."
        - alert: HvacHumidityHigh
          expr: hvac:humid_ratio:24h > 0.25
          for: 6h
          labels: {severity: info}
          annotations:
            summary: Indoor RH exceeded 55% for over a quarter of occupied time. Raise overcool-to-dehumidify or check fan settings.
