---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: home-assistant-config
    files:
      - config/configuration.yaml
  - name: home-assistant-packages
    files:
      - config/packages/hvac.yaml
      - config/packages/vacuum.yaml
  - name: home-assistant-dashboards
    files:
      - config/dashboards/home.yaml
      - config/dashboards/climate.yaml
      - config/dashboards/network.yaml
      - config/dashboards/media.yaml
configurations:
  - kustomizeconfig.yaml
