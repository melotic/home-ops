---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Long-lived HA access token used by the Prometheus ServiceMonitor scrape.
# 1Password: vault Zion, item `home-assistant-prometheus`, field `token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-prometheus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-prometheus
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: home-assistant-prometheus
