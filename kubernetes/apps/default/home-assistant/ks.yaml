---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: default
spec:
  components:
    - ../../../../components/crowdsec
    - ../../../../components/cnpg-database
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: multus-networks
      namespace: kube-system
  path: ./kubernetes/apps/default/home-assistant/app
  postBuild:
    substitute:
      CROWDSEC_POLICY_NAME: home-assistant-crowdsec
      CROWDSEC_HTTPROUTE: home-assistant
      APP: home-assistant
      PG_DATABASE: home-assistant
      PG_USER: home-assistant
      KOPIUR_CAPACITY: 8Gi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
