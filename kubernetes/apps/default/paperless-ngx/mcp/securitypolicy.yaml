---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: paperless-mcp-anthropic-only
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: paperless-mcp
  authorization:
    defaultAction: Deny
    rules:
      # Anthropic outbound ranges: https://platform.claude.com/docs/en/api/ip-addresses
      - name: allow-anthropic-outbound
        action: Allow
        principal:
          clientCIDRs:
            - 160.79.104.0/21
            - 153.61.208.0/20
