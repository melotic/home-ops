---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CiliumProject/cilium/main/pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnetworkpolicies.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            "k8s:app.kubernetes.io/component": proxy
            "k8s:app.kubernetes.io/managed-by": envoy-gateway
            "k8s:app.kubernetes.io/name": envoy
            "k8s:gateway.envoyproxy.io/owning-gateway-name": envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": default
            "k8s:app.kubernetes.io/name": paperless-ngx
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
