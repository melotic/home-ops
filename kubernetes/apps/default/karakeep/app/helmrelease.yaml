---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 1h
  values:
    controllers:
      karakeep:
        # ponytail: pin replicas so an out-of-band `kubectl scale` can't silently
        # drift this to 0 again (it did — 17d at 0/0 with a live route). Drift
        # detection is off, so git must own the count.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # s6-overlay refuses to start non-root unless /run is owned by the run
          # uid; chown the shared /run emptyDir (keep CAP_CHOWN — do not drop ALL).
          fix-run:
            image:
              repository: docker.io/library/busybox
              tag: latest@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command: ["sh", "-c", "chown 1000:1000 /run"]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
        containers:
          web:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
            env:
              BROWSER_WEB_URL: http://localhost:9222
              CRAWLER_FULL_PAGE_ARCHIVE: "true"
              CRAWLER_PARSER_MEM_LIMIT_MB: "1024"
              CRAWLER_STORE_PDF: "true"
              DATA_DIR: /data
              DB_WAL_MODE: "true"
              DISABLE_NEW_RELEASE_CHECK: "true"
              DISABLE_PASSWORD_AUTH: "true"
              # bge-m3 emits 1024-dim vectors; karakeep defaults to 1536 and rejects the mismatch.
              EMBEDDING_DIMENSIONS: "1024"
              EMBEDDING_ENABLE_AUTO_INDEXING: "true"
              EMBEDDING_TEXT_MODEL: bge-m3
              HOME: /tmp
              INFERENCE_CONTEXT_LENGTH: "8192"
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
              INFERENCE_IMAGE_MODEL: qwen3.8-27b
              INFERENCE_JOB_TIMEOUT_SEC: "600"
              INFERENCE_MAX_OUTPUT_TOKENS: "8192"
              INFERENCE_TEXT_MODEL: qwen3.8-27b
              MEILI_ADDR: http://localhost:7700
              NEXTAUTH_URL: https://karakeep.melotic.dev
              OAUTH_AUTO_REDIRECT: "true"
              OAUTH_PROVIDER_NAME: authentik
              OAUTH_WELLKNOWN_URL: https://sso.melotic.dev/application/o/karakeep/.well-known/openid-configuration
              OCR_USE_LLM: "true"
              OPENAI_API_KEY: sk-noop
              OPENAI_BASE_URL: http://llama-swap.default.svc.cluster.local:8080/v1
              OPENAI_REASONING_EFFORT: none
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              # s6-overlay needs a writable root (it cannot chown the root-owned
              # /run as non-root). Non-root is preserved; the writable rootfs +
              # root fix-run init are covered by the root-and-writable-rootfs-infra
              # Kyverno exception.
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          chrome:
            image:
              repository: docker.io/zenika/alpine-chrome
              tag: "124@sha256:eb3378c1ed0079f94db054a5fe1aaa790a254ec0d6bbc67eda052420d86a179d"
            args:
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            env:
              HOME: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              # renovate: datasource=docker depName=docker.io/getmeili/meilisearch allowedVersions=/^v?1\.50\.0$/
              tag: v1.58.0@sha256:cee0d2e31191594ff8e1651eb144aabd95b389a0bc3532327ecfb9ed91dffe7e
            env:
              # Needed for the v1.41 -> v1.46 dumpless migration; remove after success only if operationally safe.
              # v1.50→v1.52 dumpless upgrade; remove after first successful boot.
              MEILI_UPGRADE_DB: "true"
              MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: "true"
              HOME: /tmp
              MEILI_ENV: production
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: karakeep-secret
                  key: MEILI_MASTER_KEY
              MEILI_NO_ANALYTICS: "true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Full settings reindexing exceeded 1Gi during the app-owned restore.
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: karakeep
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Karakeep"
          gethomepage.dev/description: "Bookmarks and notes"
          gethomepage.dev/group: "Apps"
          gethomepage.dev/weight: "20"
          gethomepage.dev/icon: "karakeep.svg"
          gethomepage.dev/href: "https://karakeep.melotic.dev"
          gethomepage.dev/widget.type: "karakeep"
          gethomepage.dev/widget.url: "http://karakeep.default.svc.cluster.local:3000"
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_KARAKEEP_API_KEY}}" }}'
        hostnames:
          - "karakeep.melotic.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      # Single volsync-backed PVC shared by web (SQLite) and meilisearch (index)
      # via isolated subPaths — mounting a generated PVC would collide with the
      # volsync-created "karakeep" claim (app-template names it after the release).
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            web:
              - path: /data
                subPath: data
            meilisearch:
              - path: /meili_data
                subPath: meili
      run:
        type: emptyDir
        advancedMounts:
          karakeep:
            fix-run:
              - path: /run
            web:
              - path: /run
      web-tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            web:
              - path: /tmp
      chrome-tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            chrome:
              - path: /tmp
      meili-tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            meilisearch:
              - path: /tmp
