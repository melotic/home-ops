---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-database-settings
  namespace: database
spec:
  # One-shot. GitLab flags unlimited statement_timeout; per-role/database settings have no
  # declarative CNPG field, so changing the SQL requires a new Job name.
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:18.7-202611122305-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
          command:
            - /bin/sh
            - -c
            - |
              psql -v ON_ERROR_STOP=1 \
                -c "ALTER DATABASE gitlab SET statement_timeout = '60s'" \
                -c "ALTER DATABASE gitlab SET idle_in_transaction_session_timeout = '60s'"
          env:
            - name: PGHOST
              value: postgres-cluster-rw.database.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-superuser
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
