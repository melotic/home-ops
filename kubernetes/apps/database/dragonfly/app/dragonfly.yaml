---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-ha
spec:
  replicas: 3
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.0@sha256:18228a84e2305d60de390f972f9622ec252120834b22c12b9e5025144b0b37fe
  imagePullPolicy: IfNotPresent
  args:
    - --dbnum=16
    - --maxmemory=512mb
    - --proactor_threads=2
    - --dbfilename=dump
  serviceAccountName: dragonfly-ha
  enableReplicationReadinessGate: true
  # Consumers run in default and gitlab; the operator policy only allows same-namespace Redis traffic.
  networkPolicyEnabled: false
  serviceSpec:
    name: dragonfly
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: dragonfly-ha
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: dragonfly-ha
  pdb:
    minAvailable: 2
  snapshot:
    cron: "*/5 * * * *"
    enableOnMasterOnly: true
    persistentVolumeClaimSpec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ceph-block
      resources:
        requests:
          storage: 2Gi
