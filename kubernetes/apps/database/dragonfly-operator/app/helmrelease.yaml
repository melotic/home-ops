---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  values:
    grafanaDashboard:
      enabled: true
      folder: General
      grafanaOperator:
        enabled: true
        matchLabels:
          dashboards: grafana
    # force pod recreation: the current pod was created while the SA had
    # automount:false and kubelet does not inject tokens retroactively.
    # podAnnotations lands on the pod template (deploymentAnnotations only
    # annotates the Deployment object, which does not roll the RS).
    podAnnotations:
      home-operations.com/restarted-at: "2026-09-07T22:40:00Z"
    # NOTE: chart applies serviceAccount.automount only to the SA object, never
    # the pod spec. The pod-level token mount comes from the SA's automount=true
    # default (nil on the pod inherits). Setting pod-level automount:false would
    # break controller-runtime's in-cluster kubeconfig (seen in #2212).
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # nil pod automount + SA automount=true -> token projected; do not set
    # automountServiceAccountToken:false anywhere in this release.
    rbacProxy:
      image:
        tag: v0.20.2@sha256:ad0fa9f0adc928b557663297bd22c610533960d77acdec289ce8a636f0ea2114
    manager:
      image:
        tag: v1.7.0@sha256:3bfe011c73a0f642cc49808c34e2199ff378b08f2201e8bd134115706b39b9b1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
