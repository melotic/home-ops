---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${CROWDSEC_POLICY_NAME}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${CROWDSEC_HTTPROUTE}
  extAuth:
    failOpen: true
    grpc:
      backendRefs:
        - name: crowdsec-envoy-bouncer
          namespace: security
          port: 8080
