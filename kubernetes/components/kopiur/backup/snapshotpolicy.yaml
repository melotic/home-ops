---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd-fastest
  credentialProjection:
    enabled: true
  # VolSync fork identity continuation: <app>@<namespace>:/data
  identity:
    hostname: ${KOPIUR_NAMESPACE:=default}
    username: ${APP}
  mover:
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=8Gi}
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=ceph-block}
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
    securityContext:
      runAsGroup: ${KOPIUR_PGID:=1000}
      runAsUser: ${KOPIUR_PUID:=1000}
  repository:
    kind: ClusterRepository
    name: volsync
  retention:
    keepDaily: 7
    keepHourly: 24
    keepMonthly: 6
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
      sourcePathOverride: /data
  upload:
    maxParallelFileReads: 2
  verification:
    deep:
      schedule:
        cron: 0 5 * * 0
    quick:
      fileParallelism: 2
      schedule:
        cron: 0 8 * * *
    # Either count is enough: a quick verify reads files/bytes from the snapshot
    # manifest, where `fileCount` counts only files uploaded by that run, so a
    # fully deduplicated snapshot reports 0 files while still holding data. A
    # deep verify restores into scratch, so its byte count is 0 and only files
    # is meaningful. Both stay 0 for a verify that actually covered nothing.
    successExpr: "stats.errors == 0 && (stats.files > 0 || stats.bytes > 0)"
    verifyFilesPercent: 5
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
