---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-meta
  namespace: &namespace flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/flux/meta
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Flux repositories under this need flux-system hardcoded as namespace for Renovate lookups
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  deletionPolicy: WaitForTermination
  dependsOn:
    - name: cluster-meta
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          deletionPolicy: WaitForTermination
          interval: 1h
          prune: true
          retryInterval: 2m
          timeout: 5m
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - # Pin images in the external Dragonfly Operator source.
      patch: |-
        - op: add
          path: /spec/patches/-
          value:
            target:
              group: apps
              version: v1
              kind: Deployment
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: quay.io/brancz/kube-rbac-proxy:v0.16.0@sha256:2c8f8c357ff87b8bc5df4d967d5f52a23528c5e9c025f9aaa653a9ef4747585f
              - op: replace
                path: /spec/template/spec/containers/1/image
                value: docker.dragonflydb.io/dragonflydb/operator:v1.6.1@sha256:b11411142935f92ed0ec30a5ddeb31680e09ab66beecb827cb0224f1c4238638
        - op: add
          path: /spec/patches/-
          value:
            target:
              kind: Namespace
            patch: |-
              apiVersion: v1
              kind: Namespace
              metadata:
                name: database
                labels:
                  pod-security.kubernetes.io/audit: restricted
                  pod-security.kubernetes.io/audit-version: latest
                  pod-security.kubernetes.io/enforce: baseline
                  pod-security.kubernetes.io/enforce-version: latest
                  pod-security.kubernetes.io/warn: restricted
                  pod-security.kubernetes.io/warn-version: latest
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: dragonfly-operator
    - # Kyverno-specific: prevent rollback death-spiral by disabling remediateLastFailure
      patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: _
              spec:
                upgrade:
                  remediation:
                    retries: 3
                    remediateLastFailure: false
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
              name: kyverno
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: kyverno
  wait: false
