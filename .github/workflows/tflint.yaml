---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Tflint"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-job:
    name: Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Get Changed Files
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            any_changed:
              - "**/*.tf"
              - ".github/workflows/tflint.yaml"

  lint:
    name: Lint
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: "aqua:terraform-linters/tflint"

      - name: Run tflint on all Terraform roots
        run: |
          for d in $(find kubernetes -name '*.tf' -printf '%h\n' | sort -u); do
            echo "::group::tflint $d"
            tflint --chdir="$d" --recursive
            echo "::endgroup::"
          done

  tflint-status:
    name: Success
    needs: ["pre-job", "lint"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Required jobs passed?
        if: ${{ needs.pre-job.result != 'success' || (needs.pre-job.outputs.any_changed == 'true' && needs.lint.result != 'success') }}
        run: exit 1

      - name: All jobs passed or skipped?
        run: echo "${{ toJSON(needs.*.result) }}"
